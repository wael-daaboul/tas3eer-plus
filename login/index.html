<!doctype html>
<html lang="ar" dir="rtl">

<head>
  
  <script>
    (function() {
      try {
        const LOCALE_KEY = "pricingplus_locale";
        const LEGACY_KEYS = ["pricingplus_lang", "pricingplus-language", "locale", "language"];
        let locale = localStorage.getItem(LOCALE_KEY);
        if (!locale) {
          for (const key of LEGACY_KEYS) {
            const val = localStorage.getItem(key);
            if (val) { locale = val; break; }
          }
        }
        if (!locale) {
          locale = (navigator.language || "ar").toLowerCase().split("-")[0];
        }
        const activeLocale = (locale === "en" || locale === "en-us") ? "en" : "ar";
        document.documentElement.lang = activeLocale;
        document.documentElement.dir = activeLocale === "ar" ? "rtl" : "ltr";
      } catch (e) {
        console.error("Language detection failed", e);
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pricing+" />
  <link rel="icon" href="/icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="/site/site.css?v=1.0.1" />

</head>

      <img class="brand-logo logo-en" src="/assets/brand/logo-en.svg" width="180" height="28" alt="Pricing+ Logo - Product Pricing Tool" loading="eager" decoding="async" />
      
      </a>
      <nav id="siteNav" class="nav">
        <a href="/index.html" data-i18n="navHome">الرئيسية</a>
        <a href="/app/" data-i18n="navApp">الأداة</a>
        <a href="/learn/" data-i18n="navLearn">تعلّم التسعير</a>

        <a href="/support/" data-i18n="navSupport">دعم المشروع</a>

      </nav>
      <button class="nav-toggle" aria-controls="siteNav" aria-expanded="false" aria-label="Menu" type="button"><svg

  <main class="container page-main login-page">

          height="32" loading="eager" decoding="async" />

      <h1 id="loginMagicTitle">تسجيل الدخول</h1>
      <p id="loginMagicBody" class="muted">أدخل بريدك الإلكتروني وسنرسل لك رابط دخول آمن.</p>
      <p id="loginOptionalNote" class="muted"></p>

      <form id="loginMagicForm" class="auth-form" novalidate>
        <label class="field" for="loginEmail">
          <span id="loginEmailLabel">البريد الإلكتروني</span>
          <input id="loginEmail" type="email" inputmode="email" autocomplete="email" required />
          <small id="loginEmailError" class="warn-note auth-error hidden" aria-live="polite"></small>
        </label>

        <div class="actions auth-form-actions">
          <button id="sendMagicLinkBtn" type="submit" class="btn btn-primary" disabled>إرسال رابط الدخول</button>
          <a class="btn btn-secondary" href="/app/" data-i18n="ctaBackTool">العودة إلى الأداة</a>
        </div>

        <div id="loginSuccessBox" class="auth-success hidden" aria-live="polite">
          <p id="loginSuccessText" class="ok-note"></p>
          <button id="resendMagicLinkBtn" type="button" class="btn btn-secondary">Resend link</button>
        </div>

        <p id="loginSpamNote" class="muted"></p>
        <p id="loginMagicStatus" class="muted login-status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="footer">

        <span data-i18n="footerVersion">نسخة المشروع v1.0</span>
      </div>
    </div>
  </footer>

  <script type="module" src="/site/loginAuth.js"></script>
</body>

</html>
