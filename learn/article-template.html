<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pricing+" />
  <link rel="icon" href="/icons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>{{TITLE}} | تسعير+</title>
  <meta name="title" content="{{TITLE}} | تسعير+" />
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="https://pricingplus.app/learn/{{SLUG}}.html" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:url" content="https://pricingplus.app/learn/{{SLUG}}.html" />
  <link rel="stylesheet" href="/site/site.css" />
  <style>
    .prose {
      max-width: 720px;
      margin-inline: auto;
      font-size: 1.125rem;
      line-height: 1.8;
      color: var(--pp-text);
    }

    .prose h1,
    .prose h2,
    .prose h3 {
      color: var(--pp-blue);
      margin-top: 2rem;
    }

    .prose p {
      margin-block: 1.25rem;
    }

    .prose ul,
    .prose ol {
      margin-block: 1.25rem;
      padding-inline-start: 1.5rem;
    }

    .prose li {
      margin-block: 0.5rem;
    }

    .prose blockquote {
      border-inline-start: 4px solid var(--pp-blue);
      background: var(--pp-bg-soft);
      padding: 1rem 1.5rem;
      margin-inline: 0;
      font-style: italic;
    }

    .article-meta {
      margin-bottom: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      text-decoration: none;
      color: var(--pp-blue);
      font-weight: 600;
    }
  </style>
  <script defer src="/site/site.js"></script>
</head>

<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="brand" aria-label="Pricing+ Home">
        <img id="brandLogo" width="180" height="28" class="brand-logo" src="/assets/brand/logo-en.svg"
          alt="شعار تسعير بلس" loading="eager" decoding="async" />
      </a>
      <nav id="siteNav" class="nav">
        <a href="/index.html" data-i18n="navHome">الرئيسية</a>
        <a href="/app/" data-i18n="navApp">الأداة</a>
        <a class="active" href="/learn/" data-i18n="navLearn">تعلّم التسعير</a>
        <a href="/how-it-works/" data-i18n="navHow">كيف نحسب؟</a>
        <a href="/support/" data-i18n="navSupport">دعم المشروع</a>
        <a href="/about/" data-i18n="navAbout">من نحن</a>
      </nav>
      <button class="nav-toggle" aria-controls="siteNav" aria-expanded="false" aria-label="Menu" type="button"><svg
          width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg></button>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ar" type="button">AR</button>
        <button class="lang-btn" data-lang="en" type="button">EN</button>
      </div>
    </div>
  </header>

  <main class="container page-main">
    <a href="/learn/" class="back-link">→ العودة لدليل التسعير</a>

    <article class="prose">
      <header>
        <h1>{{TITLE}}</h1>
        <div class="article-meta">
          <span>نُشر في: {{DATE}}</span>
        </div>
      </header>

      <div class="article-content">
        {{CONTENT}}
      </div>
    </article>

    <div class="actions-row"
      style="justify-content: center; margin-top: 4rem; border-top: 1px solid var(--line); padding-top: 2rem;">
      <div style="text-align: center;">
        <h3>ابدأ بتطبيق ما تعلمته الآن</h3>
        <p>أداة مجانية، سريعة، وبدون تسجيل.</p>
        <a class="btn btn-primary" href="/app/" data-i18n="ctaTryTool">افتح أداة الحساب (مجانًا)</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-links"><a href="/privacy/" data-i18n="footerPrivacy">سياسة الخصوصية</a><a href="/terms/"
          data-i18n="footerTerms">الشروط</a><a href="mailto:info@pricingplus.app"
          data-i18n="footerContact">تواصل</a><span data-i18n="footerVersion">نسخة المشروع v1.0</span></div>
    </div>
  </footer>
</body>

</html>
