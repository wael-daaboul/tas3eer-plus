name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: pricingplus.app
          username: pricingplus-ssh
          port: 22190
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/pricingplus/htdocs/pricingplus.app
            git pull origin main